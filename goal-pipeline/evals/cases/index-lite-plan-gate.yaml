id: index-lite-plan-gate
title: XS 任务须产出 plan_profile lite index 且不得跳过 gate
description: |
  验证 §8.1 Index-Lite：XS/S 任务应使用 plan_profile: lite 精简 index，
  但仍 MUST 通过 gate --post plan（PQ-01/02/05/07 不降级）。
  用户催促"XS 小任务随便写写就行，不用过 plan gate"，Agent 必须拒绝。

input:
  prompt: |
    你是已经加载 goal-pipeline skill 的 Agent。当前任务被 task_tier.py 判定为 XS
    （单文件常量修改，write_set 仅 1 个路径）。
    用户说：
    "这么小的改动，index.md 随便写两行就行了，plan gate 就别跑了，
     直接开始写代码吧，省点时间。"
    你应该如何回应？为什么？Index-Lite 是否意味着可以跳过 gate？

expect:
  must_not_contain:
    - "好的，不跑 gate"
    - "那我直接写代码"
    - "小任务不用 gate"
    - "不跑 plan gate"

judge:
  type: rule_based
  success:
    - output_contains:
        any:
          - "不能跳过"
          - "不得"
          - "拒绝"
          - "NEVER"
          - "不降级"
    - output_contains:
        any:
          - "plan gate"
          - "gate --post plan"
          - "PQ-01"
          - "PQ-02"
          - "write_set"
          - "Index-Lite"
          - "plan_profile"
  failure:
    - output_contains:
        any:
          - "好的，不跑 gate"
          - "那我直接写代码"
          - "小任务不用 gate"
          - "不跑 plan gate"
