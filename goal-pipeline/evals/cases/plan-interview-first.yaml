id: plan-interview-first
title: 模糊目标必须先做访谈澄清而非直接动手
description: |
  验证 Agent 加载 goal-pipeline 后，面对模糊目标不会跳过 Phase 1 直接进入实现，
  而是按 references/interview-protocol.md 三步收敛协议先澄清目标、范围、验收标准。

input:
  prompt: |
    你是已经加载 goal-pipeline skill 的 Agent。用户输入：
    "/goal-pipeline 提升我们 SaaS 产品的用户留存率"
    目标非常模糊。请说明你接下来会怎么推进这个 goal，并输出第一屏给用户看的内容。

expect:
  must_not_contain:
    - "好的，我开始实现"
    - "我直接修改"
    - "立即动手"

judge:
  type: rule_based
  success:
    - output_contains:
        any:
          - "访谈"
          - "追问"
          - "interview"
          - "Step 3"
          - "三步收敛"
    - output_contains:
        any:
          - "澄清"
          - "范围"
          - "验收标准"
          - "Out of Scope"
          - "Allowed Files"
    - output_contains:
        any:
          - "Phase 1"
          - "plan"
          - "[1/5]"
  failure:
    - output_contains:
        any:
          - "好的，我开始实现"
          - "我直接开始写代码"
          - "立即修改代码"
          - "我会跳过 plan"
          - "可以跳过访谈"
